# Step 3: rolling-origin backtest of baseline forecasters on the validation window.
# All lead / horizon / step / window values are in the selected unit (CLAUDE.md Rule 1).
seed: 20261112
data_dir: data/raw
manifest: configs/manifests/splits_v1.json
out_dir: runs/step3
taus: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

units:
  day:
    lead: 1              # origin T = end of day T; targets days T+2 .. T+8
    horizon: 7           # one weekly review cycle
    step: 7              # folds at origins 74, 81 -> validation days 76..89
    n_folds: null        # null = as many folds as fit in the validation window
    window: sliding      # sliding | expanding
    window_length: 42    # feature times t in [T-L-H-41, T-L-H]
    min_history: 28
    train_stride: 1
    train_series: 12000  # seeded sample of in-sample series used for fitting
    eval_series: all     # all in-sample series are forecast
  hour:
    lead: 1              # origin T = end of hour T; targets hours T+2 .. T+25
    horizon: 24          # next 24 hours
    step: 24             # one fold per day, origin at 22:00 -> 14 folds over validation
    n_folds: null
    window: sliding
    window_length: 504   # 21 days of feature times
    min_history: 672     # 28 days of history before the first training example
    train_stride: 6      # every 6th hour as a training feature time
    train_series: 500
    eval_series: 500     # same seeded sample (hourly is expensive)

glm: {power: 1.5, alpha: 0.0001, n_samples: 400}
lgbm: {num_rounds: 300, num_threads: 12}
bootstrap: {n_boot: 2000, reference: clim, point_reference: snaive}
