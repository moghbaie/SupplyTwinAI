[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "sctwin"
version = "0.1.0"
description = "Bayesian demand intelligence and adaptive supply-chain decision twin (research code)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=1.26,<3",
    "polars>=1.20,<2",
    "pyarrow>=16",
    "pyyaml>=6",
    "pydantic>=2.7,<3",
    "huggingface_hub>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11", "types-PyYAML"]
models = ["lightgbm>=4.3", "scipy>=1.13", "scikit-learn>=1.5", "pandas>=2.2"]
bayes = ["jax>=0.4.30", "numpyro>=0.15", "arviz>=1.3"]  # 1.x API: from_dict(data), ELPD .elpd/.p

[tool.hatch.build.targets.wheel]
packages = ["src/sctwin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = ["data: needs the downloaded dataset (skipped in CI)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
